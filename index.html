<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGigs.id - Event Ticket Platform</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #000;
        color: #fff;
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }

      /* Hero Section with Background Image */
      .hero {
        height: 100vh;
        min-height: 400px;
        background-color: #000;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        overflow: hidden;
      }

      .hero::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1;
      }

      .hero > * {
        position: relative;
        z-index: 2;
      }

      .hero-content {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
      }

      .hero-title {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
        letter-spacing: -1px;
      }

      .hero-subtitle {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        color: #ccc;
      }

      .hero-quote {
        font-size: 0.9rem;
        font-style: italic;
        color: #999;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
      }

      /* Event Slider Section */
      .event-slider-section {
        background-color: #000;
        padding: 60px 20px;
        border-top: 1px solid #222;
        border-bottom: 1px solid #222;
      }

      .event-slider-container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .event-slider-title {
        text-align: center;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 40px;
        color: #fff;
      }

      .event-slider {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding: 20px 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .event-slider::-webkit-scrollbar {
        display: none;
      }

      .event-slide {
        flex: 0 0 300px;
        background-color: #111;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease, border-color 0.3s ease;
        cursor: pointer;
      }

      .event-slide:hover {
        transform: translateY(-5px);
        border-color: #fff;
      }

      .event-slide img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .event-slide-content {
        padding: 15px;
      }

      .event-slide-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .event-slide-meta {
        font-size: 0.9rem;
        color: #999;
        margin-bottom: 8px;
      }

      .event-slide-price {
        font-size: 1.2rem;
        font-weight: bold;
        color: #fff;
      }

      .slider-controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .slider-btn {
        background-color: #333;
        border: 2px solid #555;
        color: #fff;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
      }

      .slider-btn:hover {
        background-color: #fff;
        color: #000;
        border-color: #fff;
      }

      .hero h1 {
        font-size: 4rem;
        margin-bottom: 20px;
        font-weight: 800;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #fff 0%, #ccc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero p {
        font-size: 1.3rem;
        margin-bottom: 40px;
        color: #ccc;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .btn {
        display: inline-block;
        padding: 16px 40px;
        background-color: #fff;
        color: #000;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      }

      .btn:hover {
        background-color: #f0f0f0;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
      }

      .events-section {
        padding: 80px 20px;
        max-width: 1400px;
        margin: 0 auto;
        background: #000;
        margin-top: 80px; /* Space for fixed navbar */
      }

      .events-section h2 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 50px;
      }

      .events-slider-container {
        max-width: 1400px;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
      }

      .events-slider {
        display: flex;
        width: 100%;
      }

      .events-slide {
        min-width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 0 20px;
      }

      .slide-indicators {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 30px;
      }

      .slide-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #444;
        background: transparent;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .slide-indicator.active {
        background: #fff;
        border-color: #fff;
      }

      .slide-indicator:hover {
        border-color: #ccc;
      }

      .event-card {
        background: #000;
        border: 2px solid #222;
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .event-card:hover {
        border-color: #fff;
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
      }

      .event-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .event-card:hover img {
        transform: scale(1.05);
      }

      .event-card-body {
        padding: 24px;
      }

      .event-card h3 {
        margin: 0 0 12px 0;
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff;
      }

      .event-card p {
        color: #999;
        margin: 0 0 15px 0;
        line-height: 1.6;
      }

      .event-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: #666;
        padding: 12px 0;
        border-top: 1px solid #222;
        border-bottom: 1px solid #222;
        margin-bottom: 15px;
      }

      .loading {
        text-align: center;
        padding: 60px;
        color: #666;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 60px;
      }

      .pagination button {
        padding: 10px 16px;
        background: #111;
        color: white;
        border: 2px solid #222;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .pagination button:hover:not(:disabled) {
        border-color: #fff;
        background: #000;
      }

      .pagination button.active {
        background: #fff;
        color: #000;
        border-color: #fff;
      }

      .pagination button:disabled {
        background: #111;
        border-color: #111;
        color: #333;
        cursor: not-allowed;
      }

      .share-btn {
        width: 100%;
        padding: 12px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .share-btn:hover {
        background: #f0f0f0;
        transform: scale(1.02);
      }

      .price-tag {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
      }

      .status-badge {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .hero {
          padding: 80px 20px;
        }

        .hero h1 {
          font-size: 2.5rem;
        }

        .hero p {
          font-size: 1.1rem;
        }

        .events-section h2 {
          font-size: 2rem;
        }

        .events-slide {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 0 10px;
        }

        .event-card {
          border-radius: 12px;
        }

        .event-card-body {
          padding: 20px;
        }

        .pagination {
          gap: 8px;
        }

        .pagination button {
          padding: 8px 12px;
          font-size: 14px;
        }
      }

      @media (max-width: 480px) {
        .hero h1 {
          font-size: 2rem;
        }

        .hero p {
          font-size: 1rem;
        }

        .btn {
          padding: 12px 24px;
          font-size: 1rem;
        }

        .events-section {
          padding: 40px 20px;
        }

        .events-section h2 {
          font-size: 1.8rem;
          margin-bottom: 30px;
        }
      }

      /* Header Mobile Styles */
      @media (max-width: 768px) {
        .mobile-menu-btn {
          display: block !important;
        }

        .desktop-nav {
          display: none !important;
        }

        .mobile-nav {
          display: block !important;
        }
      }
    </style>

</html>
